<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LocalLift - Products</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- =========================
         NAVIGATION
    ========================== -->

    <header class="navbar">

        <div class="logo">
            Local<span>Lift</span>
        </div>


        <nav>

            <a href="index.html" id="homeNavLink">
                Home
            </a>

            <a href="businesses.html">
                Businesses
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="#">
                About
            </a>

        </nav>


        <button
            class="login-btn"
            id="authButton"
            onclick="handleAuthButton()"
        >
            Login
        </button>

    </header>



    <!-- =========================
         PAGE HEADER
    ========================== -->

    <section class="page-header">

        <div>

            <p class="small-title">
                LOCAL MARKETPLACE
            </p>

            <h1>
                Discover Products
            </h1>

            <p>
                Explore products offered by local businesses in your community.
            </p>

        </div>

    </section>



    <!-- =========================
         SEARCH
    ========================== -->

    <section class="product-search">

        <input
            type="text"
            id="productSearch"
            placeholder="Search products..."
            onkeyup="filterProducts()"
        >

    </section>



    <!-- =========================
         CATEGORIES
    ========================== -->

    <section class="product-categories">

        <button onclick="filterProductsByCategory('all')">
            All
        </button>

        <button onclick="filterProductsByCategory('grocery')">
            🛒 Grocery
        </button>

        <button onclick="filterProductsByCategory('food')">
            🍔 Food
        </button>

        <button onclick="filterProductsByCategory('fashion')">
            👕 Fashion
        </button>

        <button onclick="filterProductsByCategory('electronics')">
            💻 Electronics
        </button>

        <button onclick="filterProductsByCategory('education')">
            📚 Education
        </button>

    </section>



    <!-- =========================
         PRODUCTS
    ========================== -->

    <main
        class="product-grid"
        id="productGrid"
    >

        <!-- Products are loaded from Supabase by app.js -->

    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <h2>
            LocalLift
        </h2>

        <p>
            Helping local businesses get discovered and grow.
        </p>

        <p class="copyright">
            © 2026 LocalLift
        </p>

    </footer>



    <!-- =========================
         SCRIPTS
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/app.js"></script>


</body>

</html>
