<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LocalLift - Add Product</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        Local<span>Lift</span>
    </div>

    <nav>
        <a href="business-dashboard.html">Dashboard</a>
        <a href="businesses.html">Businesses</a>
        <a href="products.html">Products</a>
        <a href="profile.html">Profile</a>
    </nav>

    <button
        class="login-btn"
        onclick="logout()"
    >
        Logout
    </button>

</header>


<main class="add-business-container">

    <div class="add-business-card">

        <p class="small-title">
            PRODUCT MANAGEMENT
        </p>

        <h1>
            Add Product
        </h1>

        <p class="form-subtitle">
            Add a product to your LocalLift business.
        </p>


        <form id="productForm">

            <label for="productName">
                Product Name
            </label>

            <input
                type="text"
                id="productName"
                placeholder="Enter product name"
                required
            >


            <label for="productCategory">
                Category
            </label>

            <select
                id="productCategory"
                required
            >

                <option value="">
                    Select category
                </option>

                <option value="grocery">
                    Grocery
                </option>

                <option value="food">
                    Food
                </option>

                <option value="fashion">
                    Fashion
                </option>

                <option value="electronics">
                    Electronics
                </option>

                <option value="education">
                    Education
                </option>

                <option value="services">
                    Services
                </option>

            </select>


            <label for="productPrice">
                Price
            </label>

            <input
                type="number"
                id="productPrice"
                placeholder="Enter price"
                min="1"
                required
            >


            <label for="productDescription">
                Product Description
            </label>

            <textarea
                id="productDescription"
                placeholder="Describe your product"
                rows="4"
                required
            ></textarea>


            <button
                type="submit"
                class="auth-button"
            >
                Add Product
            </button>

        </form>


        <button
            class="back-button"
            onclick="window.location.href='business-dashboard.html'"
        >
            ← Back to Dashboard
        </button>

    </div>

</main>


<footer>

    <h2>
        LocalLift
    </h2>

    <p>
        Helping local businesses get discovered and grow.
    </p>

    <p class="copyright">
        © 2026 LocalLift
    </p>

</footer>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- LOCAL LIFТ JAVASCRIPT -->

<script src="js/app.js"></script>

</body>

</html>
