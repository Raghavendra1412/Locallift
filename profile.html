<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LocalLift - Profile</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<!-- NAVBAR -->

<header class="navbar">

    <div class="logo">
        Local<span>Lift</span>
    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="businesses.html">
            Businesses
        </a>

        <a href="products.html">
            Products
        </a>

        <a href="#">
            About
        </a>

    </nav>


    <button
        class="login-btn"
        onclick="logout()"
    >
        Logout
    </button>

</header>



<!-- PROFILE -->

<main class="profile-container">


    <div class="profile-card">


        <!-- PROFILE IMAGE -->

        <div class="profile-avatar">
            👤
        </div>


        <h1 id="profileName">
            User
        </h1>


        <p
            class="profile-role"
            id="profileRole"
        >
            Customer
        </p>



        <!-- PROFILE INFORMATION -->

        <div class="profile-info">


            <div class="profile-row">

                <span>
                    Full Name
                </span>

                <strong id="profileFullName">
                    -
                </strong>

            </div>



            <div class="profile-row">

                <span>
                    Email
                </span>

                <strong id="profileEmail">
                    -
                </strong>

            </div>



            <div class="profile-row">

                <span>
                    Account Type
                </span>

                <strong id="profileAccountType">
                    -
                </strong>

            </div>


        </div>



        <!-- ACTIONS -->

        <div class="profile-actions">


            <button
                class="profile-button"
                onclick="window.location.href='index.html'"
            >
                Back to Home
            </button>


            <button
                class="logout-button"
                onclick="logout()"
            >
                Logout
            </button>


        </div>


    </div>

</main>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- LOCAL LIFТ JAVASCRIPT -->

<script src="js/app.js"></script>


</body>

</html>
