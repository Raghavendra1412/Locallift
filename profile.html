<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LocalLift - Profile</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<!-- NAVBAR -->

<header class="navbar">

    <div class="logo">
        Local<span>Lift</span>
    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="businesses.html">
            Businesses
        </a>

        <a href="products.html">
            Products
        </a>

        <a href="#">
            About
        </a>

    </nav>


    <button
        class="login-btn"
        onclick="logout()"
    >
        Logout
    </button>

</header>



<!-- PROFILE -->

<main class="profile-container">


    <div class="profile-card">


        <!-- PROFILE IMAGE -->

        <div class="profile-avatar">
            👤
        </div>


        <h1 id="profileName">
            User
        </h1>


        <p
            class="profile-role"
            id="profileRole"
        >
            Customer
        </p>



        <!-- PROFILE INFORMATION -->

        <div class="profile-info">


            <div class="profile-row">

                <span>
                    Full Name
                </span>

                <strong id="profileFullName">
                    -
                </strong>

            </div>



            <div class="profile-row">

                <span>
                    Email
                </span>

                <strong id="profileEmail">
                    -
                </strong>

            </div>



            <div class="profile-row">

                <span>
                    Account Type
                </span>

                <strong id="profileAccountType">
                    -
                </strong>

            </div>


        </div>



        <!-- ACTIONS -->

        <div class="profile-actions">


            <button
                class="profile-button"
                onclick="window.location.href='index.html'"
            >
                Back to Home
            </button>


            <button
                class="logout-button"
                onclick="logout()"
            >
                Logout
            </button>


        </div>


    </div>

</main>



<script src="js/app.js"></script>


<script>

    /* Load logged-in user */

    const loggedInUser =
        getLoggedInUser();


    /* If nobody is logged in */

    if (!loggedInUser) {

        window.location.href =
            "login.html";

    }


    else {

        /* Name */

        document.getElementById(
            "profileName"
        ).textContent =
            loggedInUser.name;


        document.getElementById(
            "profileFullName"
        ).textContent =
            loggedInUser.name;


        /* Email */

        document.getElementById(
            "profileEmail"
        ).textContent =
            loggedInUser.email;


        /* Account type */

        let accountType =
            "Customer";


        if (
            loggedInUser.role === "business"
        ) {

            accountType =
                "Business Owner";

        }


        document.getElementById(
            "profileRole"
        ).textContent =
            accountType;


        document.getElementById(
            "profileAccountType"
        ).textContent =
            accountType;

    }

</script>

</body>

</html>
