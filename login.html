<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LocalLift - Login</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body class="auth-page">


    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">
            Local<span>Lift</span>
        </div>

        <nav>
            <a href="login.html">Login</a>
        </nav>

    </header>



    <!-- AUTH CONTAINER -->

    <main class="auth-container">


        <!-- LOGIN CARD -->

        <div class="auth-card" id="loginCard">

            <div class="auth-logo">
                Local<span>Lift</span>
            </div>

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Login to continue to LocalLift
            </p>


            <form id="loginForm">

                <!-- EMAIL -->

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <!-- PASSWORD -->

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <!-- ACCOUNT TYPE -->

                <div class="role-selection">

                    <p>Login as:</p>

                    <label>
                        <input
                            type="radio"
                            name="role"
                            value="customer"
                            checked
                        >
                        Customer
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="role"
                            value="business"
                        >
                        Business Owner
                    </label>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="auth-button"
                >
                    Login
                </button>

            </form>


            <!-- REGISTER -->

            <p class="register-text">

                Don't have an account?

                <a
                    href="#"
                    onclick="showRegister(); return false;"
                >
                    Register
                </a>

            </p>

        </div>



        <!-- REGISTER CARD -->

        <div
            class="auth-card register-card"
            id="registerCard"
        >

            <div class="auth-logo">
                Local<span>Lift</span>
            </div>

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Join the LocalLift community
            </p>


            <form id="registerForm">

                <!-- NAME -->

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >


                <!-- EMAIL -->

                <label for="registerEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >


                <!-- PASSWORD -->

                <label for="registerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >


                <!-- ACCOUNT TYPE -->

                <label for="accountType">
                    Account Type
                </label>

                <select id="accountType">

                    <option value="customer">
                        Customer
                    </option>

                    <option value="business">
                        Business Owner
                    </option>

                </select>


                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    class="auth-button"
                >
                    Create Account
                </button>

            </form>


            <!-- LOGIN -->

            <p class="register-text">

                Already have an account?

                <a
                    href="#"
                    onclick="showLogin(); return false;"
                >
                    Login
                </a>

            </p>

        </div>

    </main>



    <!-- SUPABASE JS -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- LOCAL LIFT JS -->

    <script src="js/app.js"></script>

</body>

</html>
